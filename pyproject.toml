[project]
name = "bcrpy"
version = "3.4.0"
description = "Python client for BCRP economic data API"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "requests",
    "termcolor",
    "colorama",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bcrpy*"]
exclude = ["tests*"]

[project.scripts]
bcrpy = "bcrpy.cli:main"
